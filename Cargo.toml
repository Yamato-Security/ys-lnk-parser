[package]
name = "sootmark-shell"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Windows shell items, LNK files (MS-SHLLINK), jump lists and compound files (MS-CFB), from the public documentation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/shell"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "lnk", "jumplist", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "shell"

[features]
default = ["guid-names"]
# Names of the GUIDs of shell items and links, from Eric Zimmerman's
# GuidMapping table (about 900 KB).
guid-names = []
# Code pages other than Windows-1252 (932 Japanese, 936, 949, 950, 1250-1258,
# ...) for ANSI strings.
codepages = ["dep:encoding_rs", "dep:codepage"]

[dependencies]
codepage = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
